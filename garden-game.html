<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>英语花园保卫战 | Unit 4</title>
<script src="phaser.min.js"></script>
<style>
:root{--ink:#213247;--paper:#fffef8;--green:#3f965f;--orange:#ee713f;--yellow:#f3c449;--line:#dfe6dc}*{box-sizing:border-box}body{margin:0;background:#e7f2e8;color:var(--ink);font-family:"Nunito","PingFang SC",Arial,sans-serif}.app{min-height:100vh;display:grid;grid-template-rows:auto 1fr}.top{height:68px;padding:10px max(14px,env(safe-area-inset-left));display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fffef8;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:10px}.back{width:38px;height:38px;border:0;border-radius:50%;background:#eef3ed;color:var(--ink);font-size:19px;cursor:pointer}.brand h1{margin:0;font-size:18px}.brand p{margin:2px 0 0;color:#718074;font-size:11px}.resources{display:flex;gap:8px}.resource{min-width:74px;padding:7px 10px;border:1px solid var(--line);background:#fff;border-radius:8px;text-align:center;font-size:11px}.resource b{display:block;font-size:16px;color:#98700e}.game-layout{width:min(1180px,100%);margin:0 auto;padding:14px;display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:14px}.board-shell{position:relative;min-width:0;background:#dceede;border:1px solid #bed4c1;border-radius:8px;overflow:hidden}.game-board{width:100%;aspect-ratio:16/10;min-height:480px}.side{background:var(--paper);border:1px solid var(--line);padding:16px;border-radius:8px;display:flex;flex-direction:column}.mission{font-size:11px;color:#a5502c;font-weight:900}.side h2{font-size:18px;margin:5px 0}.side>p{font-size:12px;line-height:1.55;color:#718074;margin:0 0 12px}.plant-list{display:grid;gap:7px}.plant-btn{display:grid;grid-template-columns:35px 1fr auto;gap:9px;align-items:center;min-height:51px;padding:8px;border:1px solid var(--line);border-radius:7px;background:#fff;text-align:left;color:var(--ink);cursor:pointer}.plant-btn.active{border-color:var(--orange);background:#fff3ec}.plant-btn:disabled{opacity:.42;cursor:not-allowed}.plant-icon{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;font-size:20px;background:#edf6e9}.plant-btn b{font-size:12px}.plant-btn small{display:block;font-size:10px;color:#7c897d;margin-top:2px}.cost{font-size:11px;font-weight:900;color:#9b7010}.tip{margin-top:auto;padding:12px;border-left:3px solid var(--green);background:#eff7ef;font-size:11px;line-height:1.6;color:#58705c}.question-panel{position:absolute;z-index:5;inset:0;background:rgba(23,47,35,.72);display:grid;place-items:center;padding:16px}.question-panel[hidden],.result[hidden]{display:none}.question-box{width:min(500px,100%);background:#fffef8;border-radius:8px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.2)}.question-meta{display:flex;justify-content:space-between;font-size:11px;color:#718074}.question-box h2{font-size:25px;line-height:1.25;margin:15px 0 4px}.question-box>p{font-size:12px;color:#718074;margin:0 0 16px}.answers{display:grid;grid-template-columns:1fr 1fr;gap:8px}.answer{min-height:46px;border:1px solid var(--line);border-radius:7px;background:#fff;padding:9px;text-align:left;font-size:13px;font-weight:800;color:var(--ink);cursor:pointer}.answer:hover{border-color:var(--orange)}.feedback{min-height:22px;margin-top:12px;font-size:12px;font-weight:900}.feedback.good{color:#397c50}.feedback.bad{color:#b84f38}.result{position:absolute;z-index:7;inset:0;background:rgba(23,47,35,.78);display:grid;place-items:center;padding:16px}.result-card{width:min(430px,100%);background:#fffef8;text-align:center;padding:28px;border-radius:8px}.result-card img{width:130px;height:130px;object-fit:cover;border-radius:50%;background:#daf1df}.result-card h2{font-size:25px;margin:12px 0 5px}.result-card p{font-size:13px;color:#6e7d70;line-height:1.5}.rewards-row{display:flex;justify-content:center;gap:9px;margin:16px 0}.reward-pill{padding:8px 11px;background:#fff5ce;border:1px solid #ead58a;border-radius:7px;font-size:12px;font-weight:900}.primary{border:0;border-radius:7px;padding:11px 16px;background:var(--orange);color:#fff;font-weight:900;cursor:pointer}@media(max-width:850px){.top{height:auto;align-items:flex-start}.game-layout{grid-template-columns:1fr;padding:9px}.game-board{min-height:410px}.side{min-height:300px}.plant-list{grid-template-columns:repeat(3,1fr)}.plant-btn{grid-template-columns:1fr;text-align:center}.cost{display:block}.tip{margin-top:12px}}@media(max-width:520px){.brand p{display:none}.brand h1{font-size:15px}.resources{gap:4px}.resource{min-width:57px;padding:6px;font-size:9px}.resource b{font-size:14px}.game-board{min-height:360px;aspect-ratio:10/11}.side{padding:12px}.plant-btn{padding:6px}.answers{grid-template-columns:1fr}.question-box{padding:17px}.question-box h2{font-size:21px}}
@media(max-width:520px){.top{flex-wrap:wrap}.brand{width:100%}.resources{width:100%}.resource{flex:1;min-width:0}.question-box{overflow:hidden}.question-box h2{font-size:20px;line-height:1.35;overflow-wrap:anywhere;word-break:break-word}.question-box>p,.answer{overflow-wrap:anywhere}}
</style>
</head>
<body>
<main class="app">
  <header class="top"><div class="brand"><button class="back" onclick="location.href='index.html'" aria-label="返回学习首页">←</button><div><h1>英语花园保卫战</h1><p>Unit 4 · Plants around us</p></div></div><div class="resources"><div class="resource"><span>阳光</span><b id="sun-count">50</b></div><div class="resource"><span>第几波</span><b id="wave-count">1 / 3</b></div><div class="resource"><span>花园能量</span><b id="heart-count">5</b></div></div></header>
  <div class="game-layout">
    <section class="board-shell">
      <div id="game" class="game-board" aria-label="英语花园塔防游戏区域"></div>
      <div id="question-panel" class="question-panel">
        <div class="question-box"><div class="question-meta"><span id="question-progress">挑战 1 / 12</span><span>答对 +25 阳光</span></div><h2 id="question-text">植物需要什么才能生长？</h2><p>选择正确答案，为花园收集阳光。</p><div id="answers" class="answers"></div><div id="feedback" class="feedback"></div></div>
      </div>
      <div id="result" class="result" hidden><div class="result-card"><img src="outputs/tiger-coach-correct.png" alt="小老虎教练庆祝"><h2 id="result-title">花园守住了！</h2><p id="result-copy">你用英语知识净化了所有迷雾。</p><div class="rewards-row"><span class="reward-pill">★ <b id="point-reward">15</b> 积分</span><span class="reward-pill">叶片 × 3</span></div><button class="primary" onclick="location.href='index.html'">返回学习首页</button></div></div>
    </section>
    <aside class="side"><span class="mission">MISSION · GARDEN 01</span><h2>选择能力植物</h2><p>先答英语题获得阳光，再选择植物并点击草地种下。守住三波迷雾怪。</p><div class="plant-list">
      <button class="plant-btn active" data-plant="sound"><span class="plant-icon">🔔</span><span><b>音符花</b><small>快速发射音符</small></span><span class="cost">☀ 50</span></button>
      <button class="plant-btn" data-plant="shield"><span class="plant-icon">🌵</span><span><b>守护芽</b><small>生命力更强</small></span><span class="cost">☀ 75</span></button>
      <button class="plant-btn" data-plant="burst"><span class="plant-icon">🌻</span><span><b>阳光花</b><small>范围能量攻击</small></span><span class="cost">☀ 100</span></button>
    </div><div class="tip" id="game-tip"><b>小老虎提示</b><br>答对第一题，就能种下第一株音符花。</div></aside>
  </div>
</main>
<script>
const questions=[
 {q:'植物需要什么才能生长？',a:['air, water and sun','cake and juice','toys and books','milk and bread'],ok:0},
 {q:'“植物”的英文是？',a:['planet','plant','plate','please'],ok:1},
 {q:'Which one is a fruit?',a:['garden','flower','apple','grass'],ok:2},
 {q:'“给花浇水”应该说？',a:['water the flowers','cut the flowers','draw the flowers','touch the flowers'],ok:0},
 {q:'Grapes are ____.',a:['long','small','tall','fast'],ok:1},
 {q:'Bananas are ____.',a:['small','blue','long','cold'],ok:2},
 {q:'I like the fresh ____.',a:['air','map','fan','bed'],ok:0},
 {q:'“我们可以种新树”是？',a:['We can cut new trees.','We can plant new trees.','We can draw new trees.','We can see new trees.'],ok:1},
 {q:'Which word means “花园”?',a:['farm','garden','grass','spring'],ok:1},
 {q:'Do you like apples? 肯定回答是？',a:['No, it is.','Yes, I do.','Yes, I am.','No, I can.'],ok:1},
 {q:'Plants can give us many ____.',a:['things','maps','numbers','colours'],ok:0},
 {q:'Which one helps plants?',a:['water','cake','toy','bed'],ok:0}
];
const plantTypes={sound:{cost:50,color:0x62b77b,rate:1100,damage:1,hp:3},shield:{cost:75,color:0x3d8d65,rate:1500,damage:1,hp:8},burst:{cost:100,color:0xf2bd3d,rate:1800,damage:2,hp:4}};
let sun=50,wave=1,hearts=5,questionIndex=0,selectedPlant='sound',sceneRef,questionOpen=true,finished=false;
const cells=[]; const plants=[]; const enemies=[];
const sunEl=document.querySelector('#sun-count'),waveEl=document.querySelector('#wave-count'),heartEl=document.querySelector('#heart-count'),panel=document.querySelector('#question-panel'),feedback=document.querySelector('#feedback'),tip=document.querySelector('#game-tip');
function updateHud(){sunEl.textContent=sun;waveEl.textContent=`${wave} / 3`;heartEl.textContent=hearts;document.querySelectorAll('.plant-btn').forEach(b=>b.disabled=sun<plantTypes[b.dataset.plant].cost)}
function showQuestion(){questionOpen=true;panel.hidden=false;const item=questions[questionIndex%questions.length];document.querySelector('#question-progress').textContent=`挑战 ${Math.min(questionIndex+1,12)} / 12`;document.querySelector('#question-text').textContent=item.q;feedback.textContent='';feedback.className='feedback';const root=document.querySelector('#answers');root.innerHTML='';item.a.forEach((answer,index)=>{const b=document.createElement('button');b.className='answer';b.textContent=`${String.fromCharCode(65+index)}. ${answer}`;b.onclick=()=>answerQuestion(index);root.appendChild(b)})}
function answerQuestion(index){const item=questions[questionIndex%questions.length];if(index!==item.ok){feedback.textContent='再想一想，小老虎相信你！';feedback.className='feedback bad';return}feedback.textContent='答对了！获得 25 阳光';feedback.className='feedback good';sun+=25;questionIndex++;updateHud();setTimeout(()=>{if(questionIndex%4!==0){showQuestion();return}panel.hidden=true;questionOpen=false;tip.innerHTML='<b>轮到你布阵</b><br>选择植物，再点击空草地。';if(plants.length===0) plantAt(0,0);},550)}
function plantAt(row,col){if(questionOpen||finished)return;const type=plantTypes[selectedPlant],occupied=plants.some(p=>p.row===row&&p.col===col);if(occupied||sun<type.cost)return;sun-=type.cost;updateHud();const {x,y}=cells[row][col];const body=sceneRef.add.circle(x,y,22,type.color).setStrokeStyle(4,0xffffff,.75);const face=sceneRef.add.text(x,y-2,selectedPlant==='sound'?'♪':selectedPlant==='shield'?'◆':'☀',{fontSize:'22px',fontStyle:'bold',color:'#ffffff'}).setOrigin(.5);plants.push({row,col,x,y,type:selectedPlant,body,face,hp:type.hp,lastShot:0});tip.innerHTML='<b>植物已就位</b><br>继续答题积攒阳光，准备下一波。';if(plants.length===1) startWave()}
function startWave(){if(finished)return;const count=wave===1?3:wave===2?5:7;for(let i=0;i<count;i++)setTimeout(()=>spawnEnemy(i%3,i%2),i*900);setTimeout(()=>{if(!finished&&wave<3){wave++;updateHud();showQuestion()}},count*900+5000)}
function spawnEnemy(row,kind){const width=sceneRef.scale.width,x=width+35,y=cells[row][0].y;const color=kind?0x7d7191:0x697b7c;const body=sceneRef.add.circle(x,y,23,color).setStrokeStyle(3,0xded9ec);const mark=sceneRef.add.text(x,y,kind?'?':'~',{fontSize:'24px',fontStyle:'bold',color:'#ffffff'}).setOrigin(.5);enemies.push({row,x,y,hp:kind?4:3,speed:kind?24:31,body,mark,dead:false})}
function shoot(plant,enemy,time){plant.lastShot=time;const shot=sceneRef.add.circle(plant.x+18,plant.y,6,plant.type==='burst'?0xf6c945:0xffffff).setStrokeStyle(2,plantTypes[plant.type].color);sceneRef.tweens.add({targets:shot,x:enemy.x,duration:420,onComplete:()=>{shot.destroy();if(enemy.dead)return;enemy.hp-=plantTypes[plant.type].damage;if(plant.type==='burst')enemies.filter(e=>!e.dead&&e.row===enemy.row&&Math.abs(e.x-enemy.x)<90).forEach(e=>e.hp--);if(enemy.hp<=0)removeEnemy(enemy)}})}
function removeEnemy(enemy){if(enemy.dead)return;enemy.dead=true;sceneRef.tweens.add({targets:[enemy.body,enemy.mark],alpha:0,scale:.2,duration:220,onComplete:()=>{enemy.body.destroy();enemy.mark.destroy();const index=enemies.indexOf(enemy);if(index>=0)enemies.splice(index,1);checkWin()}})}
function checkWin(){if(wave===3&&questionIndex>=12&&enemies.length===0&&!questionOpen){finished=true;saveWin();document.querySelector('#result').hidden=false}}
function saveWin(){try{const state=JSON.parse(localStorage.getItem('english-quest-progress')||'{}');state.points=(Number(state.points)||60)+15;state.gameWins=(Number(state.gameWins)||0)+1;localStorage.setItem('english-quest-progress',JSON.stringify(state))}catch(_){}}
document.querySelectorAll('.plant-btn').forEach(button=>button.onclick=()=>{selectedPlant=button.dataset.plant;document.querySelectorAll('.plant-btn').forEach(b=>b.classList.toggle('active',b===button))});
class GardenScene extends Phaser.Scene{constructor(){super('garden')}create(){sceneRef=this;const w=this.scale.width,h=this.scale.height;this.cameras.main.setBackgroundColor('#dceede');const left=w*.12,right=w*.86,top=h*.25,rowGap=h*.24,colGap=(right-left)/4;for(let r=0;r<3;r++){cells[r]=[];const y=top+r*rowGap;this.add.rectangle(w/2,y,w*.82,rowGap*.72,r%2?0xb9d9aa:0xc9e4b8).setStrokeStyle(2,0x9dc18e);for(let c=0;c<5;c++){const x=left+c*colGap;cells[r][c]={x,y};this.add.circle(x,y,4,0x87ae79).setAlpha(.45);const hit=this.add.rectangle(x,y,colGap*.88,rowGap*.68,0xffffff,0).setInteractive({useHandCursor:true});hit.on('pointerdown',()=>plantAt(r,c))}}this.add.text(14,12,'答题 → 获得阳光 → 种下能力植物',{fontSize:Math.max(12,w/52)+'px',fontStyle:'bold',color:'#365844'});this.add.image(w-55,55,'tiger').setDisplaySize(78,78).setCrop(0,0,1254,1254)}update(time,delta){if(finished||questionOpen)return;for(const plant of plants){const enemy=enemies.filter(e=>!e.dead&&e.row===plant.row&&e.x>plant.x).sort((a,b)=>a.x-b.x)[0];if(enemy&&time-plant.lastShot>plantTypes[plant.type].rate)shoot(plant,enemy,time)}for(const enemy of [...enemies]){if(enemy.dead)continue;enemy.x-=enemy.speed*delta/1000;enemy.body.x=enemy.mark.x=enemy.x;const blocker=plants.find(p=>p.row===enemy.row&&Math.abs(p.x-enemy.x)<35);if(blocker){blocker.hp-=delta/1200;enemy.x+=enemy.speed*delta/1000;if(blocker.hp<=0){blocker.body.destroy();blocker.face.destroy();plants.splice(plants.indexOf(blocker),1)}}if(enemy.x<20){removeEnemy(enemy);hearts--;updateHud();if(hearts<=0){finished=true;document.querySelector('#result-title').textContent='这次差一点';document.querySelector('#result-copy').textContent='调整植物位置，再用英语知识挑战一次。';document.querySelector('#point-reward').textContent='0';document.querySelector('#result').hidden=false}}}checkWin()}}
const config={type:Phaser.AUTO,parent:'game',backgroundColor:'#dceede',scale:{mode:Phaser.Scale.RESIZE,width:'100%',height:'100%'},scene:{preload(){this.load.image('tiger','outputs/tiger-coach-correct.png')},create(){new GardenScene().create.call(this)},update:GardenScene.prototype.update}};
new Phaser.Game(config);updateHud();showQuestion();
</script>
</body>
</html>
