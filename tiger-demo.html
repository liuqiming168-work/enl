<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小老虎英语教练 - 表情动画体验</title>
<style>
:root{--ink:#253044;--muted:#68758a;--paper:#fffef9;--mint:#dff5e9;--mint-strong:#65af7d;--orange:#ef7d31;--yellow:#f3c54b;--line:#e8e4da;--shadow:rgba(39,51,69,.12)}
*{box-sizing:border-box}button{font:inherit}body{margin:0;min-height:100vh;background:#f3efe7;color:var(--ink);font-family:"Nunito","PingFang SC","Helvetica Neue",Arial,sans-serif}.page{width:min(1140px,100%);margin:0 auto;padding:26px 22px 42px}.header{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:12px}.badge{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--orange);color:#fff;font-weight:1000;font-size:20px;box-shadow:0 5px 0 #c95e20}.eyebrow{color:#b95322;font-size:12px;font-weight:900}.header h1{font-size:clamp(25px,4vw,39px);margin:4px 0 0;line-height:1.12}.header p{max-width:470px;margin:0;color:var(--muted);font-size:13px;line-height:1.65}.stage{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(300px,.7fr);gap:18px;align-items:stretch}.showcase{min-height:620px;border:1px solid var(--line);border-radius:22px;background:#e6f7eb;position:relative;overflow:hidden;display:grid;place-items:center;padding:24px}.showcase:before{content:"";position:absolute;inset:auto 5% 5%;height:18%;border-radius:50%;background:rgba(75,139,95,.12);filter:blur(28px)}.tiger-wrap{width:min(100%,570px);aspect-ratio:1;position:relative;z-index:1;transform-origin:50% 88%}.tiger-img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transform:scale(.995);transition:opacity .22s ease,transform .34s ease;will-change:opacity,transform}.tiger-img.visible{opacity:1;transform:scale(1)}.bubble{position:absolute;z-index:4;top:6%;left:5%;max-width:48%;padding:13px 16px;background:#fff;border:2px solid var(--ink);border-radius:14px;box-shadow:5px 5px 0 var(--shadow);font-weight:900;line-height:1.4}.bubble small{display:block;color:#b95322;font-size:10px;margin-bottom:4px}.bubble:after{content:"";position:absolute;bottom:-10px;right:20%;width:17px;height:17px;background:#fff;border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:rotate(45deg)}.energy{position:absolute;right:20px;top:18px;z-index:5;display:flex;align-items:center;gap:7px;padding:8px 11px;border-radius:20px;background:#fff;border:1px solid var(--line);font-size:12px;font-weight:900}.energy b{color:#a04b20}.controls{border:1px solid var(--line);border-radius:18px;background:var(--paper);padding:20px}.controls h2{font-size:18px;margin:0 0 6px}.controls>p{color:var(--muted);font-size:12px;line-height:1.55;margin:0 0 16px}.state-list{display:grid;gap:8px}.state{min-height:48px;border:1px solid var(--line);background:#fff;padding:10px 12px;border-radius:9px;text-align:left;display:grid;grid-template-columns:32px 1fr auto;align-items:center;gap:9px;color:var(--ink);font-size:13px;font-weight:900;cursor:pointer;transition:border-color .18s,background .18s,transform .18s}.state:hover{border-color:var(--orange);transform:translateX(2px)}.state.active{border-color:var(--orange);background:#fff1e8;color:#a64a1d;box-shadow:0 4px 12px rgba(239,125,49,.12)}.state-icon{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:#f5f1e9;font-size:16px}.state.active .state-icon{background:#fff}.state-arrow{color:#aab1bc;font-size:16px}.status{margin-top:16px;padding:13px;border-left:4px solid var(--mint-strong);background:#eef8f1;color:var(--muted);font-size:12px;line-height:1.55}.status strong{display:block;color:var(--ink);font-size:13px;margin-bottom:3px}.spec{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);color:var(--muted);font-size:11px;line-height:1.65}.stage[data-state="idle"] .tiger-wrap{animation:breathe 2.8s ease-in-out infinite}.stage[data-state="talking"] .tiger-wrap{animation:speak .65s ease-in-out infinite alternate}.stage[data-state="listening"] .tiger-wrap{animation:listen 1.25s ease-in-out infinite alternate}.stage[data-state="thinking"] .tiger-wrap{animation:think 1.5s ease-in-out infinite alternate}.stage[data-state="correct"] .tiger-wrap{animation:celebrate .52s ease-in-out 3}.stage[data-state="retry"] .tiger-wrap{animation:encourage 1.15s ease-in-out 2}.stage[data-state="correct"] .showcase{animation:successGlow .8s ease-in-out 2}
@keyframes breathe{50%{transform:translateY(-5px) scale(1.006)}}@keyframes speak{to{transform:translateY(-4px)}}@keyframes listen{to{transform:rotate(-1.4deg) translateX(-4px)}}@keyframes think{to{transform:rotate(1.6deg) translateY(-3px)}}@keyframes celebrate{50%{transform:translateY(-18px) scale(1.015)}}@keyframes encourage{35%{transform:rotate(-1.4deg)}70%{transform:rotate(1.4deg)}}@keyframes successGlow{50%{background:#fff0b6}}
@media(max-width:820px){.header{display:block}.header p{margin-top:12px}.stage{grid-template-columns:1fr}.showcase{min-height:530px}.controls{padding:17px}}@media(max-width:520px){.page{padding:18px 12px 30px}.showcase{min-height:430px;padding:10px;border-radius:16px}.bubble{top:4%;left:4%;font-size:12px;max-width:58%;padding:9px 11px}.energy{right:10px;top:9px;padding:6px 9px}.controls{border-radius:14px}.state{min-height:46px}.header p{font-size:12px}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<main class="page">
  <header class="header">
    <div class="brand"><div class="badge">虎</div><div><div class="eyebrow">ENGLISH QUEST · LOCAL DEMO</div><h1>小老虎英语教练</h1></div></div>
    <p>这是独立体验页。六张同角色状态图会随互动切换，人物的眼神、嘴型、眉毛和动作都会真正变化。</p>
  </header>
  <section class="stage" data-state="idle" id="stage">
    <div class="showcase">
      <div class="bubble"><small id="bubble-label">TIGER COACH · READY</small><span id="bubble-line">准备好开口了吗？</span></div>
      <div class="energy"><span>★</span><b id="energy-count">12</b><span>能量</span></div>
      <div class="tiger-wrap" aria-live="polite">
        <img class="tiger-img visible" data-image="idle" src="outputs/tiger-coach-demo.png" alt="小老虎英语教练准备状态">
        <img class="tiger-img" data-image="talking" src="outputs/tiger-coach-talking.png" alt="小老虎英语教练说话状态">
        <img class="tiger-img" data-image="listening" src="outputs/tiger-coach-listening.png" alt="小老虎英语教练倾听状态">
        <img class="tiger-img" data-image="thinking" src="outputs/tiger-coach-thinking.png" alt="小老虎英语教练思考状态">
        <img class="tiger-img" data-image="correct" src="outputs/tiger-coach-correct.png" alt="小老虎英语教练庆祝状态">
        <img class="tiger-img" data-image="retry" src="outputs/tiger-coach-retry.png" alt="小老虎英语教练鼓励状态">
      </div>
    </div>
    <aside class="controls">
      <h2>看看真实表情变化</h2>
      <p>点击状态后，页面会切换到对应人物表情；“说英语”会在两个嘴型间持续交替。</p>
      <div class="state-list">
        <button class="state active" data-state="idle"><span class="state-icon">●</span><span>自然待机</span><span class="state-arrow">›</span></button>
        <button class="state" data-state="talking"><span class="state-icon">A</span><span>说英语 · 嘴型变化</span><span class="state-arrow">›</span></button>
        <button class="state" data-state="listening"><span class="state-icon">♪</span><span>认真倾听</span><span class="state-arrow">›</span></button>
        <button class="state" data-state="thinking"><span class="state-icon">?</span><span>歪头思考</span><span class="state-arrow">›</span></button>
        <button class="state" data-state="correct"><span class="state-icon">★</span><span>答对庆祝</span><span class="state-arrow">›</span></button>
        <button class="state" data-state="retry"><span class="state-icon">↻</span><span>鼓励重试</span><span class="state-arrow">›</span></button>
      </div>
      <div class="status"><strong id="status-title">自然待机</strong><span id="status-copy">小老虎轻轻呼吸，等待孩子开始学习。</span></div>
      <div class="spec"><b>本次升级</b><br>不再只移动整张画布。说话时嘴型变化；倾听时嘴巴闭合、耳朵竖起；思考时眼神和眉毛变化；答对时举起双手。</div>
    </aside>
  </section>
</main>
<script>
const states={
  idle:{label:'TIGER COACH · READY',line:'准备好开口了吗？',title:'自然待机',copy:'小老虎轻轻呼吸，等待孩子开始学习。'},
  talking:{label:'TIGER COACH · SPEAKING',line:'Hello! My name is Tiger.',title:'正在说英语',copy:'两个真实嘴型交替出现，并配合轻微身体动作。'},
  listening:{label:'TIGER COACH · LISTENING',line:'Your turn! 大声读出来。',title:'认真倾听',copy:'嘴巴闭合，耳朵竖起，眼睛专注地看着孩子。'},
  thinking:{label:'TIGER COACH · THINKING',line:'Hmm... let me think.',title:'歪头思考',copy:'眼睛向上看，眉毛和头部姿态一起变化。'},
  correct:{label:'TIGER COACH · GREAT JOB',line:'Great job! You did it!',title:'答对庆祝',copy:'小老虎举起双手跳起来，并奖励 3 点能量。'},
  retry:{label:'TIGER COACH · TRY AGAIN',line:"Almost! Let's try again.",title:'鼓励重试',copy:'表情变得温和坚定，鼓励孩子再读一次。'}
};
const stage=document.querySelector('#stage');
const images=[...document.querySelectorAll('.tiger-img')];
const buttons=[...document.querySelectorAll('.state')];
let talkTimer;
function showImage(name){images.forEach(image=>image.classList.toggle('visible',image.dataset.image===name));}
function setState(name,button){
  clearInterval(talkTimer);
  const content=states[name];
  stage.dataset.state=name;
  buttons.forEach(item=>item.classList.toggle('active',item===button));
  document.querySelector('#bubble-label').textContent=content.label;
  document.querySelector('#bubble-line').textContent=content.line;
  document.querySelector('#status-title').textContent=content.title;
  document.querySelector('#status-copy').textContent=content.copy;
  showImage(name);
  if(name==='talking'){
    let open=true;
    talkTimer=setInterval(()=>{open=!open;showImage(open?'talking':'idle');},380);
  }
  if(name==='correct'){
    const counter=document.querySelector('#energy-count');
    counter.textContent=String(Number(counter.textContent)+3);
  }
}
buttons.forEach(button=>button.addEventListener('click',()=>setState(button.dataset.state,button)));
</script>
</body>
</html>
