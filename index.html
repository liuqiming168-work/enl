<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#23384f">
  <title>刘劲英语 · 三年级上册</title>
  <link rel="icon" href="assets/openmoji/1F44B.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button class="brand" id="home-button" title="回到当前练习">
        <img src="assets/openmoji/1F44B.svg" alt="">
        <span>刘劲英语</span>
      </button>
      <div class="top-actions">
        <div class="voice-switch" aria-label="发音角色">
          <button class="voice-option active" data-voice="sarah">Sarah</button>
          <button class="voice-option" data-voice="zoom">Zoom</button>
        </div>
        <button class="points-button" id="points-button" title="查看积分兑换">
          <img src="assets/openmoji/2B50.svg" alt="">
          <strong id="points-total">340</strong><span>积分</span>
        </button>
      </div>
    </header>

    <main class="page">
      <section class="welcome">
        <div>
          <small id="unit-eyebrow">TODAY · UNIT 1</small>
          <h1>Good afternoon, 刘劲!</h1>
        </div>
        <div class="today-progress">
          <b id="today-label">今天完成 0 题</b>
          <div class="track"><i id="today-track"></i></div>
        </div>
      </section>

      <nav class="mode-grid" aria-label="练习方式">
        <button class="mode spell active" data-mode="spell">
          <span><strong>拼单词</strong><small>Spell</small></span>
          <img src="assets/openmoji/1F9E9.svg" alt="">
        </button>
        <button class="mode sentence" data-mode="sentence">
          <span><strong>组句子</strong><small>Sentence</small></span>
          <img src="assets/openmoji/1F442.svg" alt="">
        </button>
        <button class="mode speak" data-mode="speak">
          <span><strong>跟读检查</strong><small>Speak</small></span>
          <img src="assets/openmoji/1F4AC.svg" alt="">
        </button>
      </nav>

      <section class="learning-stage" id="learning-stage">
        <div class="focus">
          <div class="visual">
            <div class="object-art" id="object-art">
              <img class="semantic-icon" src="assets/openmoji/1F44B.svg" alt="你好">
            </div>
            <div class="scene-art" id="scene-art" hidden>
              <img id="scene-image" src="assets/undraw/conversation.svg" alt="">
            </div>
            <strong class="visual-label" id="visual-label">你好</strong>
            <span class="visual-note" id="visual-note"></span>
          </div>

          <div class="work" id="spell-work">
            <span class="kicker" id="word-count"></span>
            <h2>看图拼单词</h2>
            <p class="prompt-note" id="spell-instruction">先听完整单词，点选字母时也能听到它的声音。</p>
            <div class="spelling-practice" id="spelling-practice">
              <div class="slots" id="slots"></div>
              <div class="letters" id="letters"></div>
            </div>
            <div class="actions">
              <button class="icon-action primary" id="word-listen" title="听发音" aria-label="听发音">🔊</button>
              <button class="icon-action" id="word-undo" title="撤回" aria-label="撤回">↶</button>
              <button class="hint-button" id="word-hint" hidden>看看提示</button>
              <button class="speak-shortcut" id="word-speak" hidden>🎤 顺便读一遍</button>
              <button class="next" id="word-next" hidden>下一题 →</button>
            </div>
            <div class="feedback" id="word-feedback" aria-live="polite"></div>
            <div class="answer-reveal" id="word-reveal" hidden>
              <span>正确拼写</span><strong id="word-answer"></strong>
            </div>
          </div>

          <div class="work" id="sentence-work" hidden>
            <span class="kicker" id="sentence-count"></span>
            <h2>听音组装小句子</h2>
            <p class="prompt-note">先听短句，再选择打乱的单词。</p>
            <div class="sentence-slots" id="sentence-slots"></div>
            <div class="sentence-bank" id="sentence-bank"></div>
            <div class="actions">
              <button class="icon-action primary" id="sentence-listen" title="听短句" aria-label="听短句">🔊</button>
              <button class="icon-action" id="sentence-reset" title="重新排列" aria-label="重新排列">↻</button>
              <button class="hint-button" id="sentence-hint" hidden>看看提示</button>
              <button class="next" id="sentence-next" hidden>下一句 →</button>
            </div>
            <div class="feedback" id="sentence-feedback" aria-live="polite"></div>
            <div class="sentence-reveal" id="sentence-reveal" hidden>
              <strong id="sentence-answer"></strong><span id="sentence-meaning"></span>
            </div>
          </div>

          <div class="work speak-work" id="speak-work" hidden>
            <div class="speak-kind-switch" role="group" aria-label="跟读内容">
              <button class="active" data-speak-kind="word">单词跟读</button>
              <button data-speak-kind="sentence">短句跟读</button>
            </div>
            <span class="kicker" id="speak-count"></span>
            <h2 id="speak-target"></h2>
            <p class="translation" id="speak-meaning"></p>
            <div class="speak-actions">
              <button class="demo-button" id="speak-listen">🔊 听示范</button>
              <button class="record-button" id="speak-start">🎤 开始跟读</button>
            </div>
            <p class="speech-privacy">跟读录音仅用于本次发音评测，将发送至科大讯飞处理。</p>
            <div class="speech-status" id="speech-status" hidden aria-live="polite">
              <h3 id="speech-title"></h3>
              <p id="speech-detail"></p>
              <b id="speech-heard"></b>
            </div>
            <div class="actions"><button class="next" id="speak-next">下一句 →</button></div>
          </div>
        </div>

        <aside class="picker">
          <header class="picker-head">
            <div><h3 id="picker-title"></h3><span id="picker-count"></span></div>
            <div class="picker-pages">
              <button id="picker-prev" title="上一组" aria-label="上一组">‹</button>
              <button id="picker-next" title="下一组" aria-label="下一组">›</button>
            </div>
          </header>
          <div class="picker-grid" id="picker-grid"></div>
        </aside>
      </section>

      <section class="curriculum" id="curriculum">
        <header class="curriculum-head">
          <div><h2>教材地图</h2><p>人民教育出版社 · 三年级上册</p></div>
          <span class="book-badge">同步教材内容</span>
        </header>
        <div class="unit-grid" id="unit-grid"></div>
      </section>

      <section class="reward-shop" id="reward-shop">
        <header class="reward-head">
          <div><h2>积分兑换站</h2><p>认真完成练习，攒积分换奖励</p></div>
          <b><span id="reward-points">340</span> 积分可用</b>
        </header>
        <div class="reward-notice" id="reward-notice" hidden aria-live="polite"></div>
        <div class="reward-grid" id="reward-grid"></div>
        <div class="pending-area" id="pending-area" hidden>
          <h3>等待家长确认</h3>
          <div id="pending-list"></div>
        </div>
      </section>

      <p class="credit">场景与奖励插画来自 <a href="https://github.com/balazser/undraw-svg-collection" target="_blank" rel="noreferrer">unDraw SVG Collection</a>，图标来自 OpenMoji。</p>
    </main>
  </div>

  <script src="textbook-data.js"></script>
  <script src="audio-data.js"></script>
  <script src="phonics-data.js"></script>
  <script src="vendor/xfyun-recorder/index.umd.js"></script>
  <script>
    window.XFYUN_AUTH_ENDPOINT = 'https://liujin-n-signer-wdrtkmmavm.cn-hangzhou.fcapp.run';
  </script>
  <script src="xfyun-ise.js?v=20260912-2"></script>
  <script src="app.js"></script>
</body>
</html>
