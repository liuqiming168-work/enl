adius:9px;padding:9px 12px;font-size:12px;font-weight:900}.next-btn{background:var(--coral);color:#fff;border-radius:9px;padding:10px 16px;font-size:12px;font-weight:900}.voice-select{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 10px;color:var(--muted);font-size:11px;max-width:210px}

.coach-stage{height:230px;max-width:680px;margin:0 auto 22px;border-radius:14px;position:relative;overflow:hidden;background:#dceee9 url("outputs/red-panda-coach.png") center/cover no-repeat;text-align:left;box-shadow:inset 0 0 0 1px rgba(35,48,68,.08)}.coach-stage:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,255,255,.93),rgba(255,255,255,.72) 42%,rgba(255,255,255,0) 67%);pointer-events:none}.coach-bubble{position:absolute;z-index:2;left:24px;top:50%;transform:translateY(-50%);width:min(43%,270px);background:#fff;border:2px solid var(--ink);border-radius:14px;padding:15px 17px;box-shadow:5px 6px 0 rgba(35,48,68,.12)}.coach-bubble:after{content:"";position:absolute;right:-12px;top:48%;width:20px;height:20px;background:#fff;border-top:2px solid var(--ink);border-right:2px solid var(--ink);transform:rotate(45deg)}.coach-bubble small{display:block;color:var(--coral);font-weight:900;font-size:10px;margin-bottom:5px}.coach-bubble strong{display:block;font-size:17px;line-height:1.35}.coach-stage.talking{animation:coach-talk .55s ease-in-out infinite alternate}.coach-stage.listening{animation:coach-listen 1.4s ease-in-out infinite}.coach-stage.correct{animation:coach-celebrate .45s ease-in-out 3}.coach-stage.retry{animation:coach-retry .55s ease-in-out 2}.coach-stage.talking .coach-bubble,.coach-stage.listening .coach-bubble{box-shadow:5px 6px 0 rgba(91,145,214,.22)}.coach-stage.correct .coach-bubble{border-color:var(--green);box-shadow:5px 6px 0 rgba(94,170,120,.23)}.coach-stage.retry .coach-bubble{border-color:var(--yellow);box-shadow:5px 6px 0 rgba(243,189,62,.25)}@keyframes coach-talk{to{background-size:101.5%;background-position:50% 49%}}@keyframes coach-listen{50%{filter:saturate(1.07);background-position:51% center}}@keyframes coach-celebrate{50%{transform:translateY(-5px) rotate(.4deg)}}@keyframes coach-retry{35%{transform:translateX(-3px)}70%{transform:translateX(3px)}}
.report{max-width:920px}.report h1{font-size:27px;margin-bottom:4px}.report>p{font-size:13px;color:var(--muted);margin-bottom:20px}.report-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}.report-stat{border:1px solid var(--line);border-radius:13px;background:#fff;padding:16px}.report-stat b{font-size:25px;display:block}.report-stat span{font-size:11px;color:var(--muted)}.report-panel{border:1px solid var(--line);border-radius:15px;background:#fff;padding:19px;margin-bottom:15px}.report-panel h2{font-size:16px;margin-bottom:15px}.skill-row{display:grid;grid-template-columns:60px 1fr 45px;gap:10px;align-items:center;margin:12px 0;font-size:12px}.skill-row .bar{margin:0}.skill-row b{text-align:right;font-size:12px}.mistake{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid #f0ede7}.mistake:last-child{border-bottom:0}.mistake strong{font-size:13px}.mistake span{display:block;color:var(--muted);font-size:11px;margin-top:3px}.review-btn{background:#fff4df;color:#a27112;padding:7px 10px;border-radius:8px;font-size:11px;font-weight:900}

<body>
<div id="app">
<div class="shell">
<aside class="sidebar">
  <div class="brand"><div class="brand-mark">✦</div><div><strong>English Quest</strong><span>刘劲的英语探险</span></div></div>
  <div><div class="side-label">学习空间</div><nav class="main-nav">
    <button v-for="item in nav" :key="item.key" class="nav-item" :class="{active:view===item.key}" @click="view=item.key"><span class="nav-icon">{{item.icon}}</span>{{item.label}}</button>
  </nav></div>
  <div v-if="view==='course' || view==='home'"><div class="side-label">教材目录</div><div class="unit-list"><button v-for="(unit,i) in units" :key="unit.id" class="unit-item" :class="{active:selectedUnit===i}" @click="openUnit(i)"><i class="unit-dot"></i><span>{{unit.id}} {{unit.title}}</span></button></div></div>
  <div class="side-bottom"><strong>本周小目标</strong><p>完成 5 天学习<br>已经完成 {{weekDays}} / 5 天</p><div class="bar" style="margin-top:10px"><i :style="{width:(weekDays/5*100)+'%'}"></i></div></div>
</aside>
<main class="content">
  <div class="topbar"><div style="display:flex;align-items:center;gap:10px"><button class="mobile-menu" @click="view='home'">☰</button><div class="crumb"><b>{{viewTitle}}</b><span v-if="view==='practice'"> · {{currentPractice.label}}</span></div></div><div class="top-actions"><div class="streak">🔥 {{streak}} 天连续学习</div><button class="parent-btn" @click="view='report'">家长报告 ↗</button></div></div>
  <template v-if="view==='home'"><section class="hero"><div class="hero-copy"><div class="eyebrow">✦ 今天也来探险吧</div><h1>把英语，<span>说成自己的话。</span></h1><p>跟着 PEP 三年级上册新教材，从交朋友开始，认识家人、动物和身边的植物，再勇敢开口。</p><button class="hero-cta" @click="startToday">开始今天的学习 <span>→</span></button></div></section>
  <section><div class="section-head"><div><h2>今天的学习任务</h2><p>建议用时 10 分钟，完成后会自动记录进度</p></div><button class="text-btn" @click="view='course'">查看教材地图 →</button></div><div class="task-grid"><article v-for="task in tasks" :key="task.key" class="task-card"><div><div class="task-top"><span class="task-icon">{{task.icon}}</span><span class="tag" :class="task.tagClass">{{task.tag}}</span></div><h3>{{task.title}}</h3><p>{{task.desc}}</p></div><div class="task-action"><span>{{task.meta}}</span><button class="small-action" @click="startTask(task.key)">{{task.action}}</button></div></article></div></section>

      answer:position

  });

    type:'教材跟读 · ' + (index + 1) + '/' + unit.sentences.length,

      });
      if (!selectedVoiceName.value && voiceOptions.value.length) selectedVoiceName.value = voiceOptions.value[0].name;
    }
    function speak(text) {
      if (activeAudio) {
        activeAudio.pause();
        activeAudio.currentTime = 0;
        activeAudio = null;
      }
      const audioPath = window.AUDIO_FILES && window.AUDIO_FILES[text];
      if (audioPath) {
        if (window.speechSynthesis) window.speechSynthesis.cancel();
        isSpeaking.value = true;
        activeAudio = new Audio(audioPath);
        activeAudio.preload = 'auto';
        activeAudio.onended = () => { isSpeaking.value = false; activeAudio = null; };
        activeAudio.onerror = () => {
          isSpeaking.value = false;
          activeAudio = null;
          speakWithSystemVoice(text);
        };
        activeAudio.play().catch(() => {
          isSpeaking.value = false;
          activeAudio = null;
          speakWithSystemVoice(text);
        });
        return;
      }
      speakWithSystemVoice(text);
    }
    function speakWithSystemVoice(text) {
      if (!window.speechSynthesis) return;
      window.speechSynthesis.cancel();
      isSpeaking.value = true;
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-US';
      utterance.rate = speechRate.value;
      utterance.pitch = 1.02;
      const voices = window.speechSynthesis.getVoices();
      const preferred = ['Samantha','Karen','Moira','Google US English','Microsoft Zira','Tessa','Daniel'];
      const voice = voices.find(v => v.name === selectedVoiceName.value)
        || voices.find(v => preferred.some(n => v.name.includes(n)))
        || voices.find(v => v.lang === 'en-US')
        || voices.find(v => /^en(-|_)/i.test(v.lang));
      if (voice) utterance.voice = voice;
      utterance.onend = () => { isSpeaking.value = false; };
      utterance.onerror = () => { isSpeaking.value = false; };
      window.speechSynthesis.speak(utterance);
    }
    if (window.speechSynthesis) {
      loadVoices();
      window.speechSynthesis.onvoiceschanged = loadVoices;
      setTimeout(loadVoices, 300);
    }

    return {
      nav,view,viewTitle,units,selectedUnit,activeUnit,tasks,modes,practiceMode,currentPractice,
      currentQuiz,quizList,quizIndex,score,answered,selectedOption,lastCorrect,streak,weekDays,
      learned,minutes,badges,accuracy,skills,mistakes,reportTip,speechRate,voiceOptions,
      selectedVoiceName,speechSupported,isListening,recognizedText,speechMessage,speechDetail,
      speechPassed,speechResultClass,coachState,coachLabel,coachLine,openUnit,startToday,startTask,switchMode,answer,nextQuiz,
      speak,toggleListening,leavePractice
    };
  }
}).mount('#app');
</script>
